name: ci

on:
  push:
    branches: [ main, 'repair/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify format
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -z "$(gofmt -l .)" || (echo "Run gofmt on these files:" && gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os != 'Windows'
        run: go test -count=1 ./...

      - name: Native Windows suite and port workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'killport-windows-validation'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $binary = Join-Path $out 'killport.exe'
          $tests = Join-Path $out 'killport.test.exe'
          go build -trimpath -buildvcs=false -o $binary .
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI build failed' }
          go test -trimpath -buildvcs=false -c -o $tests ./internal/cli
          if ($LASTEXITCODE -ne 0) { throw 'Windows test build failed' }
          Copy-Item -LiteralPath internal/cli/testdata -Destination (Join-Path $out 'testdata') -Recurse
          & .\scripts\test-windows.ps1 -Binary $binary -TestBinary $tests -LogDirectory (Join-Path $out 'logs')

      - name: Windows validation logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: ${{ runner.temp }}/killport-windows-validation/logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Test (race detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...

      - name: Cross-compile for windows and darwin
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=windows go build -o /dev/null .
          GOOS=darwin go build -o /dev/null .

      - name: Install script tests
        if: matrix.os == 'ubuntu-latest' && hashFiles('scripts/test-install.sh') != ''
        run: sh scripts/test-install.sh
