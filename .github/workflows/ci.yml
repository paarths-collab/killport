name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify format
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -z "$(gofmt -l .)" || (echo "Run gofmt on these files:" && gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Cross-compile for windows and darwin
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=windows go build -o /dev/null .
          GOOS=darwin go build -o /dev/null .

      - name: Install script tests
        if: matrix.os == 'ubuntu-latest' && hashFiles('scripts/test-install.sh') != ''
        run: sh scripts/test-install.sh
